# 成语大全（合并完整版）

> 本文合并了黑龙江+国考近三年成语大全和黑龙江公务员考试真题成语笔记

## 成语列表

| 成语 | 释义 |
|------|------|
| 一以贯之 | 用一个根本性的道理贯通事情的始末或全部。 |
| 一劳永逸 | 辛苦一次，把事情办好，以后就不再费事了。 |
| 一厢情愿 | 指只是单方面的愿望，没有考虑对方是否同意或客观条件是否具备。 |
| 一哄而上 | 没有准备，没有组织，一下子拥上去。 |
| 一孔之见 | 比喻狭隘片面的见解。 |
| 一成不变 | 一经形成，不再改变。 |
| 一无所有 | 什么都没有，形容钱财、成绩、知识等什么都没有。 |
| 一概而论 | 用同一标准来对待或处理不同的事物。 |
| 一步到位 | 一次就达到预定的目标。 |
| 一气呵成 | 形容文章结构紧凑，文气连贯，也比喻工作连续不断，中间没有停顿。 |
| 一目了然 | 一眼就能看清。 |
| 一触即发 | 形容形势紧张，稍一触动就爆发。 |
| 一蹴而就 | 比喻事情一下子就成功。常用于否定句，表示事情不可能一下子完成。 |
| 一较高下 | 较量一下，分出高低。 |
| 一锤定音 | 比喻凭一句话做出最终决定。 |
| 一马当先 | 形容领先，也比喻带头。 |
| 一鼓作气 | 比喻趁劲头大的时候一下子把事情完成。 |
| 万无一失 | 形容绝对不会出差错，非常有把握。 |
| 不分彼此 | 形容关系密切，交情深厚。 |
| 不求甚解 | 原指读书只求领会要旨，不在一字一句的解释上多下功夫。现多指学习或研究不深入，只求知道个大概。 |
| 不痛不痒 | 比喻说话或做事没有触及要害。 |
| 不知所措 | 不知道怎么办才好，形容处境为难。 |
| 不言而喻 | 不用说就能明白，形容道理很明显。 |
| 与世隔绝 | 与社会上的人们隔离，断绝来往，形容隐居或人迹罕至的偏僻之地。 |
| 与众不同 | 表示跟大家不一样。 |
| 与时俱进 | 随着时间的推移而不断发展、前进。 |
| 严丝合缝 | 形容言行周密，无一点漏洞。 |
| 举一反三 | 从一件事情类推而知道许多事情。 |
| 举世无双 | 全世界找不到第二个，形容极其稀有。 |
| 举棋不定 | 比喻犹豫不决，像拿着棋子不知下哪。 |
| 乏善可陈 | 没有什么好的可以称道的。 |
| 了如指掌 | 形容对情况非常清楚，像指着自己的手掌看一样。 |
| 事与愿违 | 事情的发展与愿望相反。 |
| 事半功倍 | 形容花费的气力小，收到的成效大。 |
| 交口称赞 | 异口同声地称赞。 |
| 交相辉映 | 各种光亮、色彩等互相映照。 |
| 人云亦云 | 形容没有主见，只会随声附和。 |
| 人迹罕至 | 很少有人到达，形容荒凉偏僻。 |
| 从心所欲 | 按照自己的意思去做。 |
| 从长计议 | 慢慢地多加商量，不急于做出决定。 |
| 以偏概全 | 用片面的观点看待整体问题。 |
| 以守为攻 | 用防御作为击破敌人的手段。 |
| 以柔克刚 | 用柔软的方法去克制刚强的。 |
| 以点带面 | 用一个单位或地方的成功经验来带动全面工作。 |
| 以虚为实 | 把虚假的当作真实的。 |
| 以退为进 | 用退让作为进取的手段。 |

| 信口开河 | 比喻随口乱说，没有根据。 |

| 全力以赴 | 投入全部力量。 |
| 兼容并蓄 | 把不同内容、不同性质的东西收下来，保存起来。 |

| 冠冕堂皇 | 形容外表庄严或正大的样子，实际上并非如此。 |
| 冰山一角 | 比喻事物已经显露出来的一小部分。 |
| 出奇制胜 | 用对方意料不到的方法取得胜利。 |
| 刚愎自用 | 固执自信，不接受别人的意见。 |
| 别具匠心 | 指在技巧和艺术方面具有与众不同的巧妙构思。 |
| 别出机杼 | 比喻写作或创作不因袭前人，另辟新路。 |
| 刻舟求剑 | 比喻不懂事物已发展变化而仍静止地看问题。 |
| 力不从心 | 心里想做，但力量不够。 |
| 势在必行 | 从趋势看必须采取行动。 |
| 勤俭持家 | 以勤劳节约的精神操持家务。 |
| 包罗万象 | 形容内容丰富，应有尽有。 |
| 匠心独运 | 独创性地运用精巧的心思。 |
| 千头万绪 | 形容事情复杂，头绪繁多。 |
| 千姿百态 | 形容姿态多种多样。 |
| 千篇一律 | 指文章公式化，也比喻办事按一个格式，机械雷同。 |
| 千锤百炼 | 比喻经历多次艰苦斗争的锻炼和考验，也指对文章或作品进行多次精心的修改。 |
| 半途而废 | 做事中途停止，不能坚持到底。 |
| 南橘北枳 | 比喻同一物种因环境条件不同而发生变异。 |
| 厚此薄彼 | 重视或优待一方，轻视或慢待另一方。 |
| 厚积薄发 | 多多积蓄，慢慢放出，形容只有准备充分才能办好事情。 |
| 双管齐下 | 比喻两方面同时进行或两种方法同时使用。 |
| 变幻莫测 | 变化多端，难以预料。 |
| 口是心非 | 嘴上说得好听，心里想的却相反。 |
| 叹为观止 | 指赞美所见到的事物好到了极点。 |
| 各有千秋 | 各有各的存在的价值，比喻各人有各人的长处，各人有各人的特色。 |
| 各行其是 | 各自按照自己认为对的去做。 |
| 同日而语 | 同一时间比较，多用于否定句。 |
| 名副其实 | 名声或名义与实际相符合。 |
| 名存实亡 | 名义上还存在，实际上已消亡。 |
| 名正言顺 | 名义正当，道理也说得通。 |
| 后患无穷 | 以后的祸患没有尽头。 |
| 后来居上 | 后起的超过先前的。 |
| 后继无人 | 没有后人来继承事业。 |
| 向壁虚造 | 凭空捏造，对着墙壁想象。 |
| 听之任之 | 听任事情自然发展，不管不问。 |
| 哗众取宠 | 用浮夸的言论骗取群众的信任。 |
| 唯唯诺诺 | 形容一味顺从，不敢表示反对意见。 |
| 因势利导 | 顺着事情发展的趋势，加以引导。 |
| 因噎废食 | 比喻因为小毛病就不做该做的事。 |
| 因地制宜 | 根据各地的具体情况，制定适宜的办法。 |
| 坐井观天 | 比喻眼界小，见识少。 |
| 坐而论道 | 坐着空谈大道理，指口头说说，不见行动。 |

| 大势所趋 | 整个局势发展的趋向。 |

| 大显身手 | 充分显示出本领和才能。 |
| 大浪淘沙 | 比喻在激烈的斗争中经受筛选、考验。 |
