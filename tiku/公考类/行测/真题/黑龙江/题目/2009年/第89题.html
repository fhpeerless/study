<h1>2009年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2009 年黑龙江公务员考试《行测》卷</h1><h3>三、判断推理，共 40 题，本部分包括图形推理、定义判断、类比推理、逻辑判断。</h3><p class="q">89、攀比效应是指社会经济活动中某些相关的经济变量之间或经济利益主体在利益分配方面存在的相互影响， 轮番推进的现象。根据上述定义，下列属于攀比效应的是：</p><p class="opt">A、甲和乙在比谁的妻子漂亮，并约定输者请对方喝酒</p><p class="opt">B、省公安厅比较两县公安局抓获小偷数量后，认为甲县治安良好</p><p class="opt">C、甲公司技术人员到乙公司车间参观，暗下决心要向乙公司学习</p><p class="opt">D、企业职工在工资收入方面互相对比，并要求本单位上调工资，增加收入</p>
