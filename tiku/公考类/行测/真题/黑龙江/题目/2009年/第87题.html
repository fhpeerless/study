<h1>2009年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2009 年黑龙江公务员考试《行测》卷</h1><h3>三、判断推理，共 40 题，本部分包括图形推理、定义判断、类比推理、逻辑判断。</h3><p class="q">87、系统误差是指由于测量系统或测量仪器的不完善、测量技术受限、实验方法不够完善或没有保证正确的实验条件等原因产生的测量值与真实值之间的差别。根据上述定义，下列情况属于系统误差的是：</p><p class="opt">A、百米运动员两次参加比赛的成绩相差 0.1 秒</p><p class="opt">B、分别在松花江上游和下游采集的水样密度不同</p><p class="opt">C、伏安法测电阻时没有考虑电表内阻对实验结果的影响</p><p class="opt">D、晚餐饮酒过量对第二天体检血液相关指标检查结果的影响</p>
