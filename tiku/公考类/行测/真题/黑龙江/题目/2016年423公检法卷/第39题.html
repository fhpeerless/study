<h1>2016年423公务员联考《行测》（黑龙江公检法卷）</h1><h1 class="subtitle">2016 年黑龙江省公务员录用考试《行测》真题（公检法卷）</h1><h3>二、言语理解与表达。本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选出一个最恰</h3><p class="q">39、年年招工年年“荒”，受国内外经济新形势、省域产业步入新格局、务工群体产生新诉求等多重影响，持续多年的“用工荒”今年在浙江“如期而至”。与往年不同的是，随着新生代农民工群体的日益扩大，因诉求增多而导致的“用工荒”日渐明显。这段文字主要讲的是：</p><p class="opt">A、“用工荒”对企业发展的影响</p><p class="opt">B、“用工荒”表现出的新特点</p><p class="opt">C、“用工荒”产生的原因及变化</p><p class="opt">D、“用工荒”问题的解决途径</p>
