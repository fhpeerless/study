<h1>2008年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2008 年黑龙江省行政职业能力测验真题</h1><h2>第三部分 判断推理(共 40 题，参考时限 40 分钟)</h2><h3>二、定义判断（共 10 题）</h3><p class="q">78.企业法人：是指具有符合国家法律规定的资金数额、企业名称、组织章程、组织机构、住所等法定条件，能够独立承担民事责任；经主管机关核准登记取得法人资格的社会经济组织。据此定义，下列属于企业法人的是：</p><p class="opt">A.村民赵某个人独资在村里建起的养鸡厂</p><p class="opt">D.宋先生和自己的妻子在商场承包的服装销售摊位</p><p class="opt">C.某濒临破产的国有拖拉机制造厂</p><p class="opt">D.某跨国公司派驻中国的业务联络办事处</p>
