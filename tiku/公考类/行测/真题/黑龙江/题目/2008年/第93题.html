<h1>2008年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2008 年黑龙江省行政职业能力测验真题</h1><h2>第三部分 判断推理(共 40 题，参考时限 40 分钟)</h2><h3>四、演绎推理(共 10 题)</h3><p class="q">93.学校开设体育课的主要目的是使学生的身体变得健康。体育课应该集中于增氧锻炼，增氧锻炼比集体运动更能促进参与者的健康，并且实际上只有一小部分学生参加集体运动。以上观点如果正确，作者将最有效地反对下面哪一项：</p><p class="opt">A.学校里使用身体训练计划来鼓励学生终身的健康习惯</p><p class="opt">B.年轻的学生应该参加社区运动队</p><p class="opt">C.学校过分依赖于增氧练习计划来帮助所有的孩子变得身体健康</p><p class="opt">D.学校大部分体育课用来进行集体运动</p>
