<h1>2008年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2008 年黑龙江省行政职业能力测验真题</h1><h2>第二部分 言语理解与表达 (共 40 题，参考时限 30 分钟)</h2><h3>二、选词填空(共 20 题)</h3><p class="q">47.个体户目前正面临日益 <span class="blank" style="width:4.52em"></span>的竞争和税费两大压力，个体户的急剧减少导致大量小资金无法进行常规创业，<span class="blank" style="width:4.52em"></span>从而转向投机，进而使社会的不稳定程度 <span class="blank" style="width:3.58em"></span>。填入画横线部分最恰当的一项是：<span class="blank" style="width:3.58em"></span></p><p class="opt">A.残酷加剧</p><p class="opt">B.残酷加大</p><p class="opt">C.激烈加剧</p><p class="opt">D.激烈加大</p>
