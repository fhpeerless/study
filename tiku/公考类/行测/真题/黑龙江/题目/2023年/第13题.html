<h1>2023年黑龙江省公务员录用考试《行测》真题</h1><h1 class="subtitle">2023 年黑龙江省公务员录用考试《行测》题</h1><h3>一、常识判断。第一部分 常识判断。 根据题目要求，在四个选项中选出一个最恰当的答案。</h3><p class="q">13我国是世界上语言文字资源最丰富的国家之一，下列与之相关的说法不正确的是：</p><p class="opt">A、我国各民族语言分别属于汉藏、阿尔泰、南岛、南亚和印欧五大语系</p><p class="opt">B、包括东北官话、北京官话等在内的官话方言是我国十大汉语方言之一</p><p class="opt">C、我国文字从字母文字体系上看都属于古希腊字母和拉丁字母两种形式</p><p class="opt">D、汉字的字体演变先后经历了甲骨文、金文、篆书、隶书、楷书等阶段</p>
