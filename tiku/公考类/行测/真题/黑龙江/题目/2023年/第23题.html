<h1>2023年黑龙江省公务员录用考试《行测》真题</h1><h1 class="subtitle">2023 年黑龙江省公务员录用考试《行测》题</h1><h3>二、言语理解与表达。第三部分 言语理解与表达。 本部分包括表达与理解两方面的内容。请根据题</h3><p class="q">23参照国际经验，生活垃圾收费主要有从量征收和定额征收两种模式。当前，我国大多数城市的居民生活垃圾处理费为定额征收。但早在 2018 年，国家已明确提出垃圾计量收费，一些城市也制定了居民生活垃圾处理费收费标准。无论是参照国际先进经验，还是促进生态环境质量改善，生活垃圾按量收费都是 <span class="blank" style="width:3.14em"></span>。填入画横线部分最恰当的一项是：</p><p class="opt">A、必由之路</p><p class="opt">B、势在必行</p><p class="opt">C、大势所趋</p><p class="opt">D、名正言顺</p>
