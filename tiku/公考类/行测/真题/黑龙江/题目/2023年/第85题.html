<h1>2023年黑龙江省公务员录用考试《行测》真题</h1><h1 class="subtitle">2023 年黑龙江省公务员录用考试《行测》题</h1><h3>四、判断推理。第四部分 判断推理。 本部分包括图形推理、定义判断、类比推理与逻辑判断四种类</h3><p class="q">85趋触性，是指动物对其所赖以生存的基底所具有的定向作用。主动趋向基底面的叫正趋触性，主动背离基底面的称为负趋触性。根据上述定义，下列动物表现出负趋触性的是：</p><p class="opt">A、蟑螂常潜藏于狭小之缝隙间，以保持身躯与周围物体的接触</p><p class="opt">B、蝙蝠飞行时可以通过回声定位而避开一切固体障碍物</p><p class="opt">C、岩礁鱼类较长时间栖息在岩礁缝隙，通过皮肤、侧线接触岩礁</p><p class="opt">D、生活在土壤、卷叶或狭缝内的昆虫躯体两侧或背面接触物体后会静止</p>
