<h1>2010年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2010 年黑龙江公务员考试《行测》卷</h1><h3>三、判断推理，共 40 题，本部分包括图形推理、定义判断、类比推理、逻辑判断。</h3><p class="q">67、直觉思维是指行为步骤和思维过程不明确、不清晰，对某些现象或者问题直接地迅速地作出某些猜想、假设或判断的思维。下面哪一个是典型的直觉思维？（ ）</p><p class="opt">A、公安刑警根据收集到的证据，对案件进行分析。</p><p class="opt">B、军事指挥员根据侦察兵的情报材料作出军事决策。</p><p class="opt">C、根据所学过的知识解答考试时的难题。</p><p class="opt">D、医生根据病人的口述材料，迅速的做出疾病的诊断。</p>
