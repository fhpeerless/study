<h1>2010年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2010 年黑龙江公务员考试《行测》卷</h1><h3>三、判断推理，共 40 题，本部分包括图形推理、定义判断、类比推理、逻辑判断。</h3><p class="q">89、小明忘记了今天是星期几，于是他去问 O、P、Q 三人。O 回答：“我也忘记今天是星期几了，但你可以去问 P、Q 两人。”P 回答：“昨天是我说谎的日子。”Q 的回答和 P 一样。已知：① O 从来不说谎；② P 在星期一、星期二、星期三这三天说谎，其余时间都讲真话；</p><p>③ Q 在星期四、星期五、星期六这三天说谎，其余时间都讲真话。根据以上条件，今天是星期几？（ ）</p><p class="opt">A、星期一</p><p class="opt">B、星期二</p><p class="opt">C、星期四</p><p class="opt">D、星期天</p>
