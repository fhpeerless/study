<h1>2010年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2010 年黑龙江公务员考试《行测》卷</h1><h3>五、常识判断，共 25 题，根据题目要求，在选项中选出答案。</h3><p class="q">123、有学者认为美国在其崛起过程中拥有得天独厚的安全环境和国际条件。以下选项不能说明这一观点的是：</p><p class="opt">A、东西两岸的两洋隔绝使美国能够免于卷入欧亚大陆的战争和冲突。</p><p class="opt">B、通过两次世界大战，美国获得了对欧洲的巨大债券和战争赔偿。</p><p class="opt">C、德国和日本充当了对英国霸权的挑战者，而为美国掩盖了崛起的事实。</p><p class="opt">D、在美国上升为新霸权国家的同时，构建了新的国际体系和国际关系理念。</p>
