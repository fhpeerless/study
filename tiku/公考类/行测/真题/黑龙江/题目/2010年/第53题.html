<h1>2010年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2010 年黑龙江公务员考试《行测》卷</h1><h3>二、数量关系，共 20 题，本部分包括数字推理、数理计算。</h3><p class="q">53、张某下午六时多外出买菜，出门时看手表，发现表的时针和分针的夹角为 110°，七时前回家时又看手表，发现时针和分针的夹角仍是 110°。那么张某外出买菜用时：</p><p class="opt">A、20 分钟</p><p class="opt">B、30 分钟</p><p class="opt">C、40 分钟</p><p class="opt">D、50 分钟</p>
