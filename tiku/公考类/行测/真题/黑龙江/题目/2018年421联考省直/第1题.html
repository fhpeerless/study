<h1>2018年421联考《行测》真题（黑龙江卷省直）</h1><h1 class="subtitle">2018 年 421 联考《行测》真题（黑龙江卷）（省直）</h1><h3>一、常识判断，根据题目要求，在四个选项中选出一个最恰当的答案。</h3><p class="q">1、中国共产党第十九次全国代表大会的主题是： <span class="blank" style="width:5.33em"></span>，高举中国特色社会主义伟大旗帜，决胜全面建成小康社会，夺取新时代中国特色社会主<span class="blank" style="width:5.33em"></span>义伟大胜利，为实现中华民族伟大复兴的中国梦不懈奋斗。填入划横线部分最恰当的一项是：</p><p class="opt">A、不忘初心，牢记使命</p><p class="opt">B、奋发前进，使命必达</p><p class="opt">C、解放思想，改革开放</p><p class="opt">D、不忘初心，攻坚克难</p>
