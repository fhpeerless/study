<h1>2018年421联考《行测》真题（黑龙江卷省直）</h1><h1 class="subtitle">2018 年 421 联考《行测》真题（黑龙江卷）（省直）</h1><h3>三、数量关系，在这部分试题中，每道题呈现一段表述数字关系的文字，要求你迅速、准确地计算出答</h3><p class="q">75、一个班级组织跑步比赛，共设 100 米、200 米、400 米三个项目。班级有 50 人，报名参加 100 米比赛的有 27 人，参加 200 米比赛的有 25 人，参加 400 米比赛的有 21 人。如果每人最多只能报名参加 2</p><p>项比赛，那么该班最多有多少人未报名参赛？</p><p class="opt">A、11</p><p class="opt">B、12</p><p class="opt">C、13</p><p class="opt">D、14</p>
