<h1>2018年421联考《行测》真题（黑龙江卷省直）</h1><h1 class="subtitle">2018 年 421 联考《行测》真题（黑龙江卷）（省直）</h1><h3>四、判断推理，本部分包含图形推理、定义判断、类比推理和逻辑判断四个部分，根据题目的表述选择</h3><p class="q">81、前摄抑制是指先学习的材料对识记和回忆后学习的材料所产生的干扰作用；倒摄抑制是指后学习的材料对识记和回忆先学习的材料所产生的干扰作用。根据上述定义，下列选项只包含倒摄抑制的是：</p><p class="opt">A、背课文时发现中间段落往往是最难记住的</p><p class="opt">B、一天中，人们一般在早晨和夜晚的记忆效果最佳</p><p class="opt">C、学习英文字母后，之前学的拼音字母会读错</p><p class="opt">D、头部受伤后，回忆不起来之前发生的事情</p>
