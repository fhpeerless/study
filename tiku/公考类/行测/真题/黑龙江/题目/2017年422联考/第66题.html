<h1>2017年422公务员联考《行测》真题（黑龙江卷）</h1><h1 class="subtitle">2017 年 422 公务员联考《行测》黑龙江卷</h1><h3>三、数量关系，共 15 题，本部分包括数字推理、数理计算。</h3><p class="q">66、小明负责将某农场的鸡蛋运送到小卖部。按照规定，每送达 1 枚完整无损的鸡蛋，可得运费 0.1 元；若有鸡蛋破损，不仅得不到该枚鸡蛋的运费，每破损一枚鸡蛋还要赔偿 0.4 元。小明 10 月份共运送鸡蛋 25000 枚，获得运费 2480 元。那么，在运送过程中，鸡蛋破损了：</p><p class="opt">A、20 枚</p><p class="opt">B、30 枚</p><p class="opt">C、40 枚</p><p class="opt">D、50 枚</p>
