<h1>2017年422公务员联考《行测》真题（黑龙江卷）</h1><h1 class="subtitle">2017 年 422 公务员联考《行测》黑龙江卷</h1><h3>二、言语理解，共 40 题，本部分包括表达与理解两方面的内容，请根据题目要求选出答案。</h3><p class="q">39、语言本身就是人类文化长期 <span class="blank" style="width:6.20em"></span>的智慧结晶。一切人类创造的思想文化成果都需要通过语言来深度表达和精彩 <span class="blank" style="width:5.33em"></span>，如<span class="blank" style="width:6.20em"></span>果将文化视为人类精神或思维自觉 <span class="blank" style="width:5.33em"></span>的形形色色的神奇“痕迹”，那么，语言就是<span class="blank" style="width:5.33em"></span>这种“痕迹”中最鲜活、最深邃和最久远的核心部分<span class="blank" style="width:5.33em"></span>。</p><p>依次填入画横线部分最恰当的一项是：</p><p class="opt">A、演进 描述 保存</p><p class="opt">B、培育 演绎 留传</p><p class="opt">C、发展 诠释 存留</p><p class="opt">D、积淀 阐释 遗留</p>
