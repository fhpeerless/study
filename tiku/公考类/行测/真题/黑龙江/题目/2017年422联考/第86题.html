<h1>2017年422公务员联考《行测》真题（黑龙江卷）</h1><h1 class="subtitle">2017 年 422 公务员联考《行测》黑龙江卷</h1><h3>四、判断推理，共 35 题，本部分包括图形推理、定义判断、类比推理、逻辑判断。</h3><p class="q">86、共享经济指借助网络第三方平台，基于闲置资源使用权的暂时性转移，实现生产要素的社会化，提高存量资产的使用效率以创造更多价值，促进社会经济的可持续发展。根据上述定义，下列经济活动不属于共享经济的是：</p><p class="opt">A、王某从某网络平台订车去飞机场，方便快捷</p><p class="opt">B、李某从某网络平台贷款炒股，获得了预期收益</p><p class="opt">C、马某旅行前从某网络平台预定民宿，抵达后入住</p><p class="opt">D、张某从某网络平台购买外卖美食，在家享受美味</p>
