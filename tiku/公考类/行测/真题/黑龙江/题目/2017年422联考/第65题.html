<h1>2017年422公务员联考《行测》真题（黑龙江卷）</h1><h1 class="subtitle">2017 年 422 公务员联考《行测》黑龙江卷</h1><h3>三、数量关系，共 15 题，本部分包括数字推理、数理计算。</h3><p class="q">65、某商场搞抽奖促销，限每人只能参与一次，活动规则是：一个纸箱里装有 5 个大小相同的乒乓球，其中 3 个是白色 2 个是红色，参与者从中任意抽出 2 个球，如果两个都是白色可得抵用券 100 元，一白一红可得抵用券 200元，两个都是红色可得抵用券 400 元。若小李和小林两人分别参加抽奖，那么两人获得抵用券之和不少于 600 元的概率是多少？</p><p class="opt">A、0.12</p><p class="opt">B、0.22</p><p class="opt">C、0.13</p><p class="opt">D、0.30</p>
