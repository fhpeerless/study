<h1>2020年黑龙江省公务员录用考试《行测》真题</h1><h1 class="subtitle">2020 年黑龙江省公务员录用考试《行测》真题</h1><h3>四、判断推理。第四部分 判断推理。 本部分包括图形推理、定义判断、类比推理与逻辑判断四种类</h3><p class="q">102师范类院校学生来自全国各地，甲大学是师范类院校，所以甲大学的学生来自全国各地。下列选项所犯逻辑错误与上述推理最相似的是：</p><p class="opt">A、牛不是食肉动物，而狮子不是牛，所以狮子不是食肉动物</p><p class="opt">B、父母爱读书的孩子爱运动，小黄爱运动，所以小黄的父母爱读书</p><p class="opt">C、私人捐赠的教学楼遍布全国各高校，何况是邵逸夫先生捐赠的逸夫楼</p><p class="opt">D、文明司机都是礼让行人的，有些公务司机礼让行人，所以有些公务司机是文明司机</p>
