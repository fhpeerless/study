<h1>2020年黑龙江省公务员录用考试《行测》真题</h1><h1 class="subtitle">2020 年黑龙江省公务员录用考试《行测》真题</h1><h3>一、常识判断。第一部分 常识判断。 根据题目要求，在四个选项中选出一个最恰当的答案。</h3><p class="q">2习近平总书记 2020 年 3 月 6 日在决战决胜脱贫攻坚座谈会上强调，这次会议的主要任务是，分析当前形势，克服新冠肺炎疫情影响，凝心聚力，打赢脱贫攻坚战，做到“两个确保”。下列属于“两个确保”内容的是：①如期完成脱贫攻坚目标任务 ②实现经济社会高质量发展③打赢疫情防控阻击战 ④全面建成小康社会</p><p class="opt">A、①②</p><p class="opt">B、①③</p><p class="opt">C、②④</p><p class="opt">D、①④</p>
