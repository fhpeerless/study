<h1>2022年黑龙江省公务员录用考试《行测》题</h1><h1 class="subtitle">2022年黑龙江省公务员录用考试《行测》题</h1><h3>四、判断推理。第四部分 判断推理。 本部分包括图形推理、定义判断、类比推理与逻辑判断四种</h3><p class="q">78学理论。参照群体是指个体从心理上把自己列入、与之对照，并在评价、态度、行为上和在规范与价值观形成上接受其影响的群体。根据上述定义，下列选项不能用参照群体理论解释的是：</p><p class="opt">A、小王平时喜欢便装，但是参加面试时他决定穿着西装</p><p class="opt">B、夏秋之际，妈妈怕孩子受凉，很注意给孩子增减衣物</p><p class="opt">C、小刘看其他影迷都购买了偶像同款商品，自己也去买</p><p class="opt">D、小张父母都是医生，她比常人更在意身边的卫生状况</p>
