<h1>2014年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2014 年黑龙江公务员考试《行测》卷</h1><h3>四、判断推理，共 35 题，本部分包括图形推理、定义判断、类比推理、逻辑判断。</h3><p class="q">80、恐怖症是指病人持续地和非理性地害怕某一特定物体、活动或情境，这种恐惧相对于实际的威胁来说是夸大的和非理性的。根据上述定义，下列不属于恐怖症的是：</p><p class="opt">A、赵亮的上司脾气不好，赵亮每次与他交谈时都会紧张、害怕</p><p class="opt">B、张伟特别怕蜘蛛，每次看到无毒的小蜘蛛都会尖叫</p><p class="opt">C、刘红不敢去商场，她很担心自己会像上次一样突然摔倒</p><p class="opt">D、王明每次乘坐电梯都会很害怕，担心电梯的门打不开</p>
