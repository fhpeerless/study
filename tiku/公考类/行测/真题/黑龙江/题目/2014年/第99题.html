<h1>2014年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2014 年黑龙江公务员考试《行测》卷</h1><h3>四、判断推理，共 35 题，本部分包括图形推理、定义判断、类比推理、逻辑判断。</h3><p class="q">99、学前儿童低估有意识的人的思维，而高估无意识的人的思维，甚至一个成年人显然在进行思考时，他们也认为这个人并非在思考着；他们似乎对自己或其他人可能在思考什么，没有多少认识。同时，他们却高估某个沉睡中的人所具有的自我知觉和决断能力。上述论断的前提假设是：</p><p class="opt">A、成年人对人类思维的判断是比较合理的</p><p class="opt">B、学前儿童的判断能力不太成熟和稳定</p><p class="opt">C、沉睡中的人所具有的思维能力并不容易为人所了解</p><p class="opt">D、学前儿童也是在积极主动地作出心理判断</p>
