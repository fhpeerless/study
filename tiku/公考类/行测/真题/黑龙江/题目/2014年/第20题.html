<h1>2014年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2014 年黑龙江公务员考试《行测》卷</h1><h3>一、常识判断，共 20 题，根据题目要求，在选项中选出答案。</h3><p class="q">20、 在发生泥石流时，下列做法正确的是：</p><p class="opt">A、发现泥石流后，要马上向与泥石流成垂直方向一边的山坡爬</p><p class="opt">B、发生山体滑坡时，要马上沿着滑坡方向尽力奔跑</p><p class="opt">C、发生泥石流时，在沟底尽力爬到大树上进行躲避，等待救援</p><p class="opt">D、沿山谷徒步行走时，一旦遭遇大雨，发现山谷有异常的声音或听到警报时，应立即找寻较大的洞穴或巨石</p><p>躲避，等大雨过后再走</p>
