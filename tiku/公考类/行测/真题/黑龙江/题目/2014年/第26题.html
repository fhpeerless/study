<h1>2014年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2014 年黑龙江公务员考试《行测》卷</h1><h3>二、言语理解，共 30 题，本部分包括表达与理解两方面的内容，请根据题目要求选出答案。</h3><p class="q">26、森林的大面积减少，水土流失、风沙弥漫，这可怕的景象绝不是______，而是活生生的现实。不认真解决水害、沙害，土地资源流失与人口膨胀所造成的弊病，21 世纪的可持续发展将成为空想。大自然的警告，足以________。填入画横线部分最恰当的一项是：</p><p class="opt">A、虚张声势 当头棒喝</p><p class="opt">B、危言耸听 醍醐灌顶</p><p class="opt">C、空穴来风 振聋发聩</p><p class="opt">D、耸人听闻 警钟长鸣</p>
