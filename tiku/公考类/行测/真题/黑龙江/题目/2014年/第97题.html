<h1>2014年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2014 年黑龙江公务员考试《行测》卷</h1><h3>四、判断推理，共 35 题，本部分包括图形推理、定义判断、类比推理、逻辑判断。</h3><p class="q">97、中国作家莫言凭借《丰乳肥臀》、《蛙》等作品获得诺贝尔文学奖，他将“魔幻现实主义与民间故事、历史与当代社会融合在一起”。得奖后，他的作品集在国内多个城市被抢购一空，成为近期最畅销书籍后，又开始走出中国，走向世界，深受国外读者追捧。由此可以推出：</p><p class="opt">A、诺贝尔文学奖是评判文学作品优劣的准绳</p><p class="opt">B、国内外读者对诺贝尔奖的审评结果格外看重</p><p class="opt">C、越来越多的读者喜欢魔幻现实主义这一文学题材</p><p class="opt">D、越来越多的外国作家对中国文化感兴趣</p>
