<h1>2014年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2014 年黑龙江公务员考试《行测》卷</h1><h3>二、言语理解，共 30 题，本部分包括表达与理解两方面的内容，请根据题目要求选出答案。</h3><p class="q">43、市场经济本质是法治经济，市场和法治是同一硬币的两面，缺一不可。与计划经济时代不同，市场经济对资源的配置是通过竞争机制实现的，这就必须依循一套完善的规则，以实现通过市场这只“看不见的手”对经济进行调整。这段文字主要说的是：</p><p class="opt">A、市场经济与计划经济的不同在于法治</p><p class="opt">B、市场经济的发展离不开法治与市场</p><p class="opt">C、市场竞争可以实现资源的合理配置</p><p class="opt">D、法治是市场经济良性发展的基本保障</p>
