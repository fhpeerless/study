<h1>2019年420联考《行测》真题（黑龙江公检法卷）</h1><h1 class="subtitle">2019 年 420 联考《行测》真题（黑龙江公检法卷）</h1><h3>三、数量关系，在这部分试题中，每道题呈现一段表述数字关系的文字，要求你迅速、准确地计算出答案。</h3><p class="q">70、某公交站台附近区域停放 A 型共享单车 4 辆，B 型共享单车 5 辆，C 型共享单车 6 辆。一公交车到站后，下车的乘客随机选择其中 13 辆单车骑走。问 B 型和 C 型单车全部被骑走的概率在以下哪个范围内？</p><p class="opt">A、在 10%以下</p><p class="opt">B、在 10%~15%之间</p><p class="opt">C、在 15%~20%之间</p><p class="opt">D、超过 20%</p>
