<h1>2019年420联考《行测》真题（黑龙江公检法卷）</h1><h1 class="subtitle">2019 年 420 联考《行测》真题（黑龙江公检法卷）</h1><h3>二、言语理解与表达，本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选出一个最恰当的</h3><p class="q">33、胰岛素是由胰岛分泌的一种激素，功能是促进细胞 <span class="blank" style="width:7.08em"></span>葡萄糖。如果胰岛细胞受到损害，不能分泌足量胰岛素，那么人体血糖含量就会升高，多余的<span class="blank" style="width:7.08em"></span>血糖会进入尿中，这就是糖尿病。糖尿病是一种对人体危害很大的慢性病，对于糖尿病患者来说，注射胰岛素显然是最 <span class="blank" style="width:7.08em"></span>的疗法。</p><p class="opt">A、合成 直接</p><p class="opt">B、消耗 主流</p><p class="opt">C、转化 简单</p><p class="opt">D、分解 有效</p>
