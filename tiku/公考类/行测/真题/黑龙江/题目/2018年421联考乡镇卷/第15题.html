<h1>2018年421联考《行测》真题（黑龙江乡镇卷）</h1><h1 class="subtitle">2018 年黑龙江公务员考试行测真题（乡镇卷）</h1><h3>一、常识判断，根据题目要求，在四个选项中选出一个最恰当的答案。</h3><p>15 2014 年，万某开了一家网店，专门销售各类知名品牌的鞋服等商品，后经相关品牌的权利人发现并鉴定万某销售的商品均系仿冒其注册商标的产品。在上述案例中，相关知名品牌的权利人不可以：</p><p class="opt">A、要求工商部门对万某的行为进行查处</p><p class="opt">B、没收万某销售的侵权商品</p><p class="opt">C、向法院起诉主张赔偿</p><p class="opt">D、与万某进行协商解决</p>
