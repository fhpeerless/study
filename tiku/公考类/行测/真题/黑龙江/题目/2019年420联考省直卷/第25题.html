<h1>2019年420联考《行测》真题（黑龙江省直卷）</h1><h1 class="subtitle">2019 年 420 联考《行测》真题（黑龙江省直卷）</h1><h3>二、言语理解与表达，本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选</h3><p class="q">25、圈椅是明代家具中最为经典的制作。明代圈椅，造型古朴典雅，线条简洁流畅，制作技艺达到了____的境地。“天圆地方”是中国人文化中____的宇宙观，不但建筑受其影响，也____到了家具的设计之中。依次填入划横线部分最恰当的一项是：</p><p class="opt">A、别有匠心 普遍 融合</p><p class="opt">B、巧夺天工 特殊 融会</p><p class="opt">C、炉火纯青 典型 融入</p><p class="opt">D、入室升堂 独特 融化</p>
