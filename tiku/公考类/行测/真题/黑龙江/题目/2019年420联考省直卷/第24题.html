<h1>2019年420联考《行测》真题（黑龙江省直卷）</h1><h1 class="subtitle">2019 年 420 联考《行测》真题（黑龙江省直卷）</h1><h3>二、言语理解与表达，本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选</h3><p class="q">24、关于科学革命的讨论 <span class="blank" style="width:5.76em"></span>于十七世纪。不过，其时革命尚在 <span class="blank" style="width:4.89em"></span>地展开，相关讨论的焦点集中在科学的本性，而未<span class="blank" style="width:5.76em"></span>有所谓“科学革命史”的理解。到十九世纪，现代<span class="blank" style="width:4.89em"></span>科学的基本模式逐渐定型，一些学者便回到现代科学的源头做起了编史和整理工作。依次填入划横线部分最恰当的一项是：</p><p class="opt">A、滥觞 如火如荼</p><p class="opt">B、溯源 轰轰烈烈</p><p class="opt">C、起源 风起云涌</p><p class="opt">D、发端 方兴未艾</p>
