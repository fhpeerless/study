<h1>2019年420联考《行测》真题（黑龙江省直卷）</h1><h1 class="subtitle">2019 年 420 联考《行测》真题（黑龙江省直卷）</h1><h3>二、言语理解与表达，本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选</h3><p class="q">27、除了口误，笔误同样泄露了潜意识的秘密。短信聊天说到我爸身体不舒服却不去医院检查这一事实时，我想说“我爸就是太固执了”，但我键入的文字竟是“我爸就是太过分了”。那一刻，我突然呆住了。一词之别，却</p><p>暴露出我内心深处的真实情绪。“固执”只是一种较为客观的 <span class="blank" style="width:3.14em"></span>，而“过分”却是饱含着情绪的 <span class="blank" style="width:3.15em"></span>。</p><p class="opt">A、判断 认识</p><p class="opt">B、体现 流露</p><p class="opt">C、显示 暗示</p><p class="opt">D、描述 表达</p>
