<h1>2017年黑龙江公务员考试《行测》真题（公检法卷）</h1><h1 class="subtitle">2017 年黑龙江省公务员录用考试《行测》真题（公检法卷）</h1><h3>一、常识判断。根据题目要求，在四个选项中选出一个最恰当的答案。</h3><p class="q">18、下列符合法律规定的是：</p><p class="opt">A、陆某参与了为期三个月的地震救灾应急援助工作，这期间单位应给他双倍工资和福利待遇</p><p class="opt">B、黄某在微博上对李某进行辱骂，李某以侵犯名誉权为由将黄某告上法庭</p><p class="opt">C、某商场进行商品促销，规定所有商品购买后概不退换</p><p class="opt">D、张某就职于某电器公司，在怀孕五个月时不幸流产，可享受不超过 15 天的产假</p>
