<h1>2017年黑龙江公务员考试《行测》真题（公检法卷）</h1><h1 class="subtitle">2017 年黑龙江省公务员录用考试《行测》真题（公检法卷）</h1><h3>二、言语理解与表达。本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选出一个最恰当的答案。</h3><p class="q">38、同样是《白蛇传》，美丽善良多情的白素贞在京剧里是姓“京”，到了昆曲中便姓了“昆”，而常香玉演来则 <span class="blank" style="width:3.58em"></span>是一位河南白娘子。同样的 <span class="blank" style="width:4.45em"></span>，被不同的戏曲剧种表达出来，构成了戏曲舞台 <span class="blank" style="width:4.46em"></span>的风貌，<span class="blank" style="width:3.58em"></span>给人以独特的艺术享受。<span class="blank" style="width:4.46em"></span><span class="blank" style="width:4.45em"></span>依次填入画横线部分最恰当的一项是：</p><p class="opt">A、俨然 酸甜苦辣 千奇百怪</p><p class="opt">B、简直 悲欢离合 姹紫嫣红</p><p class="opt">C、全然 喜怒哀乐 千姿百态</p><p class="opt">D、完全 嬉笑怒骂 异彩纷呈</p>
