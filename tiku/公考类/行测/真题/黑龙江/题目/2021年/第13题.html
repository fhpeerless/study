<h1>2021年黑龙江公务员录用考试《行测》真题</h1><h1 class="subtitle">2021 年黑龙江公务员录用考试《行测》真题</h1><h3>一、常识判断。第一部分 常识判断。 根据题目要求，在四个选项中选出一个最恰当的答案。</h3><p class="q">13下列关于我国突发事件应对的表述错误的是：</p><p class="opt">A、突发事件应对工作实行预防为主、预防与应急相结合的原则</p><p class="opt">B、新闻媒体应当无偿开展突发事件预防与应急、自救与互救知识的公益宣传</p><p class="opt">C、突发事件分为自然灾害、事故灾难、公共卫生事件和群体性事件</p><p class="opt">D、国务院有关部门、县级以上地方各级人民政府及其有关部门、有关单位应当为专业应急救援人员购</p><p>买人身意外伤害保险</p>
