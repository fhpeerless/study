<h1>2021年黑龙江公务员录用考试《行测》真题</h1><h1 class="subtitle">2021 年黑龙江公务员录用考试《行测》真题</h1><h3>三、数量关系。第三部分 数量关系。 在这部分试题中，每道题呈现一段表述数字关系的文字，要求</h3><p class="q">59</p><p>随着人们生活水平的提高，汽车拥有量迅速增长，汽车牌照号码需要扩容。某地级市交通管理部门出台了一种小型汽车牌照组成办法，每个汽车牌照后五位的要求必须是：前三位为阿拉伯数字，后两位为两个不重复的英文字母（字母 O、I 不参与组牌），那么用这种方法可以给该地区汽车上牌照的数量为：</p><p class="opt">A、397440 辆</p><p class="opt">B、402400 辆</p><p class="opt">C、552000 辆</p><p class="opt">D、576000 辆</p>
