<h1>2016年423公务员联考《行测》（黑龙江县乡卷）</h1><h1 class="subtitle">2016 年黑龙江省公务员录用考试《行测》真题（县乡卷）</h1><h3>三、数量关系。在这部分试题中，每道题呈现一段表述数字关系的文字，要求你迅速、准确地计算出答案。</h3><p class="q">74、博物馆是一个为社会发展提供服务的非营利教育机构，但不是所有的孩子都喜欢参观博物馆，也不是所有的孩子在参观博物馆时都喜欢听讲解，但是所有喜欢听讲解的孩子都喜欢参观博物馆。根据以上信息，可以得出以下哪项？</p><p class="opt">A、所有喜欢参观博物馆的孩子都喜欢听讲解</p><p class="opt">B、不喜欢听讲解的孩子也不喜欢参观博物馆</p><p class="opt">C、所有的孩子都不喜欢参观博物馆</p><p class="opt">D、有的孩子在参观博物馆时不喜欢听讲解</p>
