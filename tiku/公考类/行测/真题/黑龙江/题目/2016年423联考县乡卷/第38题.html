<h1>2016年423公务员联考《行测》（黑龙江县乡卷）</h1><h1 class="subtitle">2016 年黑龙江省公务员录用考试《行测》真题（县乡卷）</h1><h3>二、言语理解与表达。本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选出一个最恰</h3><p class="q">38、一个作家要成为著名作家、伟大作家，就不能做时代的旁观者。而是要以“在场者”的姿态切入当下，展现社会 <span class="blank" style="width:7.08em"></span>，反映民生疾苦，讴歌人性光辉。即使写小人物，也可写出生活的幽微之处和时代的现实关照，给主人公 <span class="blank" style="width:7.08em"></span>上时代光影，濡染上时代色彩。依次填入画横线部分最恰当的一项是：</p><p class="opt">A、责任 描绘</p><p class="opt">B、全貌 描摹</p><p class="opt">C、现实 映射</p><p class="opt">D、变迁 投射</p>
