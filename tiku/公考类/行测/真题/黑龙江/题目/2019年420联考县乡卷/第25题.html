<h1>2019年420联考《行测》真题（黑龙江县乡卷）</h1><h1 class="subtitle">2019 年 420 联考《行测》真题（黑龙江县乡卷）</h1><h3>二、言语理解与表达，本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选出一个最恰当的</h3><p class="q">25、面对异质文化间的交流，特别是走出国门的艺术展示，我们常会想当然地选择 <span class="blank" style="width:5.34em"></span>受众，在艺术观念与表现样式上有意融合甚至直接“迎合”，而这样做的结果往往得不到理想的效果<span class="blank" style="width:5.34em"></span>。艺术风格的坚持、纯化与适度包容，更有利于我们向世界更好地展现中国艺术的精华，同时接收当地受众的文化 <span class="blank" style="width:5.33em"></span>。</p><p class="opt">A、尊重 评论</p><p class="opt">B、迁就 反馈</p><p class="opt">C、考虑 主张</p><p class="opt">D、顾及 观念<span class="blank" style="width:5.33em"></span></p>
