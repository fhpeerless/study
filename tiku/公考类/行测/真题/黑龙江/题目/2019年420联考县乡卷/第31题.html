<h1>2019年420联考《行测》真题（黑龙江县乡卷）</h1><h1 class="subtitle">2019 年 420 联考《行测》真题（黑龙江县乡卷）</h1><h3>二、言语理解与表达，本部分包括表达与理解两方面的内容。请根据题目要求，在四个选项中选出一个最恰当的</h3><p class="q">31、蚕蛾往往能巧妙避开捕食者，它们利用旋转的后翅来 <span class="blank" style="width:5.33em"></span>蝙蝠的声纳系统，从而 <span class="blank" style="width:5.33em"></span>捕食者对捕食目标的定位。但人们对蚕蛾的进化史以及它们后翅<span class="blank" style="width:5.33em"></span>多样性形成的原因 <span class="blank" style="width:5.33em"></span>科<span class="blank" style="width:5.33em"></span>学家对数百个基因组数据库的后翅形状进化过程进行了研究，发现了不同翅型的进化特征。<span class="blank" style="width:5.33em"></span>依次填入划横线部分最恰当的一项是：</p><p class="opt">A、躲避 引导 一知半解</p><p class="opt">B、折射 诱导 茫然不解</p><p class="opt">C、规避 引诱 不求甚解</p><p class="opt">D、反射 误导 知之甚少</p>
