<h1>2015年黑龙江公务员考试《行测》卷</h1><h1 class="subtitle">2015 年黑龙江公务员考试《行测》卷</h1><h3>二、言语理解，共 35 题，本部分包括表达与理解两方面的内容，请根据题目要求选出答案。</h3><p class="q">28、贺兰山岩画自发现以来，给人们的震撼和向人们提出的问题几乎同样多，有关岩画的内容、年限、创作族群等等问题，专家们____，贺兰山岩画上空的这些谜团至今依然烟云缭绕。考古界有句名言：“唯一能确定的就是不确定！”贺兰山岩画似乎____了这句话，岩画研究中的诸多观点都陷入了一种不可确定中。依次填入画横线部分最恰当的一项是：</p><p class="opt">A、唇枪舌战 延伸</p><p class="opt">B、莫衷一是 呼应</p><p class="opt">C、不置可否 诠释</p><p class="opt">D、各持己见 印证</p>
